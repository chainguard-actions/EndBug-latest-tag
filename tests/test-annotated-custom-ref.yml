name: Test annotated tag with custom ref
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Point origin at a local bare repo
        run: |
          REMOTE="$RUNNER_TEMP/remote-annotated.git"
          rm -rf "$REMOTE"
          git init --bare "$REMOTE"
          git -C "$REMOTE" config receive.shallowUpdate true
          git remote set-url origin "$REMOTE" 2>/dev/null || git remote add origin "$REMOTE"
          git tag -d stable 2>/dev/null || true
          echo "REMOTE=$REMOTE" >> "$GITHUB_ENV"
      - id: action
        uses: .
        with:
          ref: stable
          description: Stable release marker
      - name: Assert annotated 'stable' tag pushed with message
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git --git-dir="$REMOTE" rev-parse 'refs/tags/stable^{commit}' 2>/dev/null || true)"
          TYPE="$(git --git-dir="$REMOTE" cat-file -t refs/tags/stable 2>/dev/null || true)"
          BODY="$(git --git-dir="$REMOTE" cat-file -p refs/tags/stable 2>/dev/null || true)"
          echo "head: $HEAD_SHA remote: $REMOTE_SHA type: $TYPE"
          echo "$BODY"
          if [ "$REMOTE_SHA" != "$HEAD_SHA" ]; then
            echo "FAIL: remote 'stable' tag does not point at HEAD"
            exit 1
          fi
          if [ "$TYPE" != "tag" ]; then
            echo "FAIL: expected annotated tag, got '$TYPE'"
            exit 1
          fi
          if ! echo "$BODY" | grep -q "Stable release marker"; then
            echo "FAIL: tag message missing"
            exit 1
          fi
          if git --git-dir="$REMOTE" rev-parse -q --verify refs/tags/latest >/dev/null; then
            echo "FAIL: default 'latest' tag should not have been pushed"
            exit 1
          fi
          echo "PASS"
